version: '3.8'

services:
  whatsapp-api:
    build: 
      context: ./Notification/NODEJS
      dockerfile: Dockerfile
    container_name: whatsapp-automation
    ports:
      - "5000:5000"
    volumes:
      - ./Notification/NODEJS/session:/app/session
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - notification-network

  email-api:
    build:
      context: ./Notification/PYTHON
      dockerfile: Dockerfile
    container_name: email-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - notification-network

  notification-server:
    build:
      context: ./Notification/PYTHON
      dockerfile: Dockerfile
    container_name: notification-server
    environment:
      - PYTHONPATH=/app
      - DB_HOST=${DB_HOST:-localhost}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
    depends_on:
      - whatsapp-api
      - email-api
    restart: unless-stopped
    networks:
      - notification-network

networks:
  notification-network:
    driver: bridge

volumes:
  session-data:
  logs:
